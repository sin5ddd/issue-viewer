[package]
name = "issue-viewer"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.31"
egui = "0.31"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
keyring = "3"
sys-locale = "0.3"
webbrowser = "1"
dirs = "5"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

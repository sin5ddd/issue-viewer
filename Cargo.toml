[package]
name = "issue-viewer"
version = "0.1.5"
edition = "2024"

[dependencies]
eframe = "0.31"
egui = "0.31"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
sys-locale = "0.3"
webbrowser = "1"
dirs = "5"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
egui_commonmark = { version = "0.20", default-features = false, features = ["pulldown_cmark", "load-images", "fetch", "svg"] }
egui_extras = { version = "0.31", default-features = false, features = ["image", "svg", "http", "file"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }
rusty-mermaid = "=0.2.0"
rusty-mermaid-core = "=0.2.0"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
winresource = "0.1.31"
